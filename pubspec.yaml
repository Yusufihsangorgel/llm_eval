name: llm_eval
description: >-
  A Dart test harness for LLM evals: assertion checks over model outputs, an
  optional LLM-as-judge, and cached responses so CI stays deterministic.
version: 1.2.0
repository: https://github.com/Yusufihsangorgel/llm_eval
topics:
  - llm
  - ai
  - testing
  - evaluation
  - ci

screenshots:
  - description: "Two eval runs at the same 75% pass rate: one case broke while another was fixed, and the baseline diff names both while a threshold on the rate sees neither."
    path: doc/baseline-diff.png
  - description: "You bind one model function; the harness runs cases concurrently, checks outputs, caches responses, and reports pass rate and scores."
    path: doc/architecture.png

environment:
  sdk: ^3.8.0

dependencies:
  crypto: ^3.0.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  xml: ^7.0.0
